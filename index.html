<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Message Excerpt</title>
<style>
:root{
  --page:#f5f5f7; --panel:#ffffff; --line:#e5e5ea; --text:#111114; --muted:#8e8e93;
  --blue:#0a84ff; --left:#e9e9eb; --leftText:#111114; --right:#0a84ff; --rightText:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:28px 18px 60px}
.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:25px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(340px,430px) minmax(0,1fr);gap:22px;align-items:start}
.previewWrap{position:sticky;top:18px}
.phone{width:100%;max-width:390px;margin:auto;background:#fff;border:1px solid #d9d9dd;border-radius:32px;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,.08)}
.status{height:31px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px 5px;font-size:12px;font-weight:650}
.nav{height:76px;border-bottom:1px solid #ededf0;display:grid;grid-template-columns:54px 1fr 54px;align-items:center;padding:3px 10px 6px}
.back{font-size:31px;color:var(--blue);line-height:1}.contact{text-align:center;min-width:0}.avatar{width:40px;height:40px;border-radius:50%;margin:0 auto 2px;background:#ececf0;color:#6f6f74;display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.messages{min-height:480px;padding:14px 11px 18px;display:flex;flex-direction:column;gap:5px;background:#fff}.stamp{text-align:center;color:var(--muted);font-size:11px;font-weight:500;margin:3px 0 10px}.row{display:flex}.row.left{justify-content:flex-start}.row.right{justify-content:flex-end}.bubble{max-width:79%;padding:8px 12px;border-radius:18px;font-size:15px;line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere}.narration{width:100%;padding:10px 7px;margin:3px 0;color:#3a3a3c;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.narration.italic{font-style:italic}.narration.center{text-align:center}.narration.right{text-align:right}.left .bubble{background:var(--left);color:var(--leftText);border-bottom-left-radius:5px}.right .bubble{background:var(--right);color:var(--rightText);border-bottom-right-radius:5px}.composer{height:49px;border-top:1px solid #ededf0;padding:8px 10px;display:flex;align-items:center;gap:7px}.plus{width:30px;height:30px;border-radius:50%;background:#e9e9ed;display:flex;align-items:center;justify-content:center;color:#666;font-size:20px}.fakeInput{height:32px;flex:1;border:1px solid #d6d6da;border-radius:18px;color:#a0a0a5;padding:6px 11px;font-size:13px}.send{width:28px;height:28px;border-radius:50%;background:var(--right);color:white;display:flex;align-items:center;justify-content:center;font-weight:800}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:13px}.panel h2{font-size:15px;margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{display:block;color:#6e6e73;font-size:12px;margin:0 0 5px}input[type=text],input[type=time],textarea,select{width:100%;border:1px solid #d9d9de;background:#fff;color:#111;border-radius:10px;padding:9px 10px;outline:none}input:focus,textarea:focus,select:focus{border-color:#7dbbff;box-shadow:0 0 0 3px rgba(10,132,255,.12)}textarea{min-height:91px;resize:vertical}.colors{display:flex;gap:10px}.colorBox{flex:1}.colorRow{display:flex;align-items:center;gap:7px}.colorRow input{width:43px;height:39px;border:0;padding:0;background:none}.hex{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.btn{border:1px solid #d7d7dc;background:#fff;color:#202024;border-radius:10px;min-height:40px;padding:8px 12px;font-weight:650;font-size:13px}.btn.primary{background:#111114;color:#fff;border-color:#111114}.btn.blue{background:#0a84ff;color:#fff;border-color:#0a84ff}.btn.danger{color:#d70015}.msgList{display:flex;flex-direction:column;gap:7px;margin-top:12px}.msgItem{display:grid;grid-template-columns:55px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid #ececf0;border-radius:10px}.badge{font-size:11px;text-align:center;border-radius:8px;padding:5px;background:#f1f1f4}.snippet{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini{border:0;background:#f1f1f4;border-radius:8px;padding:6px 8px}.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}.switchrow input{width:18px;height:18px}.notice{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}.fileLabel{display:inline-flex;align-items:center;justify-content:center}.fileLabel input{display:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}.previewWrap{position:static}.top{align-items:start;flex-direction:column}.phone{max-width:390px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Message Excerpt</h1><div class="sub">iMessage-inspired chat excerpt maker</div></div>
    <div class="actions">
      <button class="btn" id="resetBtn">초기화</button>
      <button class="btn blue" id="saveBtn">PNG 저장</button>
    </div>
  </div>

  <div class="layout">
    <div class="previewWrap">
      <div class="phone" id="capture">
        <div class="status"><span id="statusTime">3:23</span><span>●●●　Wi-Fi　▰</span></div>
        <div class="nav">
          <div class="back">‹</div>
          <div class="contact">
            <div class="avatar" id="avatar"><span id="initial">재</span></div>
            <div class="name"><span id="contactName">신재림</span> ›</div>
          </div>
          <div></div>
        </div>
        <div class="messages" id="messages">
          <div class="stamp" id="stamp">오늘 오후 3:23</div>
        </div>
        <div class="composer">
          <div class="plus">＋</div><div class="fakeInput">iMessage</div><div class="send">↑</div>
        </div>
      </div>
    </div>

    <main>
      <section class="panel">
        <h2>화면 설정</h2>
        <div class="grid">
          <div><label for="nameInput">상대 이름</label><input id="nameInput" type="text" value="신재림" maxlength="30"></div>
          <div><label for="timeInput">시간</label><input id="timeInput" type="time" value="15:23"></div>
          <div>
            <label>프로필 이미지</label>
            <label class="btn fileLabel">이미지 선택<input id="avatarInput" type="file" accept="image/*"></label>
          </div>
          <div class="switchrow"><label for="stampToggle" style="margin:0">날짜/시간 문구 표시</label><input id="stampToggle" type="checkbox" checked></div>
          <div class="full colors">
            <div class="colorBox"><label>상대 말풍선</label><div class="colorRow"><input id="leftColor" type="color" value="#e9e9eb"><span class="hex" id="leftHex">#E9E9EB</span></div></div>
            <div class="colorBox"><label>내 말풍선</label><div class="colorRow"><input id="rightColor" type="color" value="#0a84ff"><span class="hex" id="rightHex">#0A84FF</span></div></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>내용 추가</h2>
        <div class="grid">
          <div><label for="typeInput">형식</label><select id="typeInput"><option value="dialogue">대사 · 말풍선</option><option value="narration">지문 · 줄글</option></select></div>
          <div id="speakerBox"><label for="sideInput">화자</label><select id="sideInput"><option value="left">상대 · 왼쪽</option><option value="right">나 · 오른쪽</option></select></div>
          <div id="narrationOptions" class="full" style="display:none">
            <div class="grid">
              <div><label for="narrationAlign">지문 정렬</label><select id="narrationAlign"><option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option></select></div>
              <div class="switchrow"><label for="italicToggle" style="margin:0">지문 기울임</label><input id="italicToggle" type="checkbox"></div>
            </div>
          </div>
          <div class="full"><label for="messageInput" id="contentLabel">대사</label><textarea id="messageInput" placeholder="대사를 입력하세요."></textarea></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="addBtn">내용 추가</button>
          <button class="btn" id="swapBtn">좌우 바꾸기</button>
          <button class="btn danger" id="clearBtn">전체 내용 삭제</button>
        </div>
        <div class="notice">대사는 말풍선으로, 지문은 말풍선 없이 줄글로 들어가. Ctrl/Cmd + Enter로도 추가할 수 있어.</div>
        <div class="msgList" id="msgList"></div>
      </section>
    </main>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const state={messages:[
  {type:'narration',text:'비가 유리창을 얇게 두드렸다. 한참 말이 없던 화면 위로 짧은 메시지가 떠올랐다.',align:'left',italic:false},
  {type:'dialogue',side:'left',text:'어디야.'},
  {type:'dialogue',side:'right',text:'왜.'},
  {type:'narration',text:'답장은 생각보다 빨랐다.',align:'left',italic:true},
  {type:'dialogue',side:'left',text:'그냥 물어봤어.'},
  {type:'dialogue',side:'right',text:'나 보고 싶어서?'}
]};
const root=document.documentElement;
function escapeText(s){return String(s)}
function render(){
  const box=$('#messages');
  box.querySelectorAll('.row,.narration').forEach(n=>n.remove());
  state.messages.forEach((m,i)=>{
    if(m.type==='narration'){
      const n=document.createElement('div');
      n.className='narration '+(m.align||'left')+(m.italic?' italic':'');
      n.textContent=m.text; box.appendChild(n);
    }else{
      const row=document.createElement('div'); row.className='row '+m.side;
      const bubble=document.createElement('div'); bubble.className='bubble'; bubble.textContent=m.text;
      row.appendChild(bubble); box.appendChild(row);
    }
  });
  const list=$('#msgList'); list.innerHTML='';
  state.messages.forEach((m,i)=>{
    const item=document.createElement('div'); item.className='msgItem';
    const badge=document.createElement('div'); badge.className='badge'; badge.textContent=m.type==='narration'?'지문':(m.side==='left'?'상대':'나');
    const snip=document.createElement('div'); snip.className='snippet'; snip.textContent=m.text.replace(/\n/g,' ');
    const del=document.createElement('button'); del.className='mini'; del.type='button'; del.textContent='삭제';
    del.addEventListener('click',()=>{state.messages.splice(i,1);render()});
    item.append(badge,snip,del); list.appendChild(item);
  });
}
function syncName(){
  const v=$('#nameInput').value.trim()||'상대';
  $('#contactName').textContent=v; $('#initial').textContent=v.charAt(0);
}
function syncTime(){
  const v=$('#timeInput').value||'15:23', [h,m]=v.split(':').map(Number);
  const h12=(h%12)||12, ap=h<12?'오전':'오후';
  $('#statusTime').textContent=h12+':'+String(m).padStart(2,'0');
  $('#stamp').textContent='오늘 '+ap+' '+h12+':'+String(m).padStart(2,'0');
}
function syncColors(){
  root.style.setProperty('--left',$('#leftColor').value);
  root.style.setProperty('--right',$('#rightColor').value);
  $('#leftHex').textContent=$('#leftColor').value.toUpperCase();
  $('#rightHex').textContent=$('#rightColor').value.toUpperCase();
}
function addMessage(){
  const input=$('#messageInput'), text=input.value.trim();
  if(!text){input.focus();return}
  if($('#typeInput').value==='narration'){
    state.messages.push({type:'narration',text,align:$('#narrationAlign').value,italic:$('#italicToggle').checked});
  }else{
    state.messages.push({type:'dialogue',side:$('#sideInput').value,text});
  }
  input.value=''; render(); input.focus();
}
$('#addBtn').addEventListener('click',addMessage);
$('#messageInput').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();addMessage()}});
$('#nameInput').addEventListener('input',syncName);
$('#timeInput').addEventListener('input',syncTime);
$('#leftColor').addEventListener('input',syncColors);
$('#rightColor').addEventListener('input',syncColors);
$('#stampToggle').addEventListener('change',e=>$('#stamp').style.display=e.target.checked?'block':'none');
$('#swapBtn').addEventListener('click',()=>{$('#sideInput').value=$('#sideInput').value==='left'?'right':'left'});
$('#typeInput').addEventListener('change',()=>{
  const narration=$('#typeInput').value==='narration';
  $('#speakerBox').style.display=narration?'none':'block';
  $('#narrationOptions').style.display=narration?'block':'none';
  $('#swapBtn').style.display=narration?'none':'inline-block';
  $('#contentLabel').textContent=narration?'지문':'대사';
  $('#messageInput').placeholder=narration?'지문을 줄글로 입력하세요.':'대사를 입력하세요.';
});
$('#clearBtn').addEventListener('click',()=>{state.messages=[];render()});
$('#avatarInput').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{
    $('#avatar').querySelectorAll('img').forEach(x=>x.remove());
    const img=document.createElement('img'); img.src=r.result; img.alt='프로필'; $('#avatar').prepend(img); $('#initial').style.display='none';
  }; r.readAsDataURL(f);
});
$('#resetBtn').addEventListener('click',()=>{
  state.messages=[
    {type:'narration',text:'비가 유리창을 얇게 두드렸다. 한참 말이 없던 화면 위로 짧은 메시지가 떠올랐다.',align:'left',italic:false},
    {type:'dialogue',side:'left',text:'어디야.'},
    {type:'dialogue',side:'right',text:'왜.'},
    {type:'narration',text:'답장은 생각보다 빨랐다.',align:'left',italic:true},
    {type:'dialogue',side:'left',text:'그냥 물어봤어.'},
    {type:'dialogue',side:'right',text:'나 보고 싶어서?'}
  ];
  $('#nameInput').value='신재림'; $('#timeInput').value='15:23'; $('#leftColor').value='#e9e9eb'; $('#rightColor').value='#0a84ff'; $('#stampToggle').checked=true; $('#stamp').style.display='block';
  $('#avatar').querySelectorAll('img').forEach(x=>x.remove()); $('#initial').style.display=''; syncName();syncTime();syncColors();render();
});
$('#saveBtn').addEventListener('click',async()=>{
  const btn=$('#saveBtn'), old=btn.textContent; btn.textContent='PNG 만드는 중…'; btn.disabled=true;
  try{
    const mod=await import('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/+esm');
    const dataUrl=await mod.toPng($('#capture'),{pixelRatio:3,backgroundColor:'#ffffff'});
    const a=document.createElement('a'); a.download='message-excerpt.png'; a.href=dataUrl; a.click();
  }catch(err){
    alert('PNG 저장 모듈을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
  }finally{btn.textContent=old;btn.disabled=false}
});
syncName();syncTime();syncColors();render();
</script>
</body>
</html>
