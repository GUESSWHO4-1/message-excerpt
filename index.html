<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message Excerpt V2</title>
<style>
:root{--bg:#f5f5f7;--line:#dddde2;--left:#e9e9eb;--right:#0a84ff;--bs:15px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#17171a}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;padding:28px 18px 60px}.head,.actions,.tabs,.tools{display:flex;gap:8px;flex-wrap:wrap}.head{justify-content:space-between;align-items:end;margin-bottom:18px}h1{margin:0;font-size:25px}.sub,.help{color:#85858d;font-size:12px}.layout{display:grid;grid-template-columns:410px 1fr;gap:22px;align-items:start}.preview{position:sticky;top:16px}.tabs{margin-bottom:8px}.tab,.btn{border:1px solid #d6d6db;background:white;border-radius:9px;padding:8px 11px;font-weight:650}.tab.on,.btn.dark{background:#17171a;color:white}.btn.blue{background:#0a84ff;color:white;border-color:#0a84ff}.btn.red{color:#d70015}.phone{background:#fff;border:1px solid #d7d7dc;border-radius:28px;overflow:hidden;box-shadow:0 12px 38px #00000012}.nav{height:55px;border-bottom:1px solid #eee;display:grid;grid-template-columns:45px 1fr 45px;align-items:center;padding:0 10px}.back{font-size:30px;color:#0a84ff}.name{text-align:center;font-size:13px;font-weight:650}.messages{min-height:550px;padding:17px 12px 24px;display:flex;flex-direction:column;gap:6px}.row{display:flex}.left{justify-content:flex-start}.right{justify-content:flex-end}.bubble{max-width:80%;padding:8px 12px;border-radius:18px;font-size:var(--bs);line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}.left .bubble{background:var(--left);color:#111;border-bottom-left-radius:5px}.right .bubble{background:var(--right);color:#fff;border-bottom-right-radius:5px}.nar{padding:10px 7px;margin:3px 0;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.composer{height:48px;border-top:1px solid #eee;display:flex;gap:7px;align-items:center;padding:8px 10px}.plus,.send{width:29px;height:29px;border-radius:50%;display:grid;place-items:center}.plus{background:#e9e9ed;color:#666;font-size:20px}.send{background:var(--right);color:white}.fake{flex:1;border:1px solid #d5d5da;border-radius:18px;padding:6px 11px;color:#aaa;font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;color:#707078;font-size:12px;margin-bottom:5px}input[type=text],input[type=number],textarea,select{width:100%;border:1px solid #d6d6dc;border-radius:10px;padding:9px 10px;background:white}textarea{min-height:105px;resize:vertical}.colors{display:flex;align-items:center;gap:8px}.colors input{width:44px;height:38px;border:0}.editor{min-height:125px;border:1px solid #d6d6dc;border-radius:10px;padding:11px;line-height:1.7;white-space:pre-wrap;outline:none}.tool{height:36px;border:1px solid #d6d6dc;background:white;border-radius:8px;padding:0 10px}.hilite{display:grid;grid-template-columns:45px 1fr 55px auto auto;gap:7px;align-items:center;margin-top:8px}.list{display:flex;flex-direction:column;gap:7px;margin-top:12px}.item{display:grid;grid-template-columns:55px 1fr auto;gap:7px;align-items:center;border:1px solid #ececf0;border-radius:9px;padding:7px}.badge{font-size:11px;background:#f0f0f3;border-radius:7px;padding:5px;text-align:center}.snip{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini{border:0;border-radius:7px;padding:6px;background:#f0f0f3}.help{line-height:1.55;margin-top:8px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.preview{position:static}.grid{grid-template-columns:1fr}.full{grid-column:auto}.hilite{grid-template-columns:45px 1fr 55px}.hilite button{grid-column:span 3}}
</style></head><body><div class="app">
<div class="head"><div><h1>Message Excerpt V2</h1><div class="sub">*별표 안 = 지문 · 별표 밖 = 대사*</div></div><div class="actions"><button class="btn" id="reset">초기화</button><button class="btn blue" id="png">현재 페이지 PNG</button><button class="btn dark" id="pngAll">전체 페이지 PNG</button></div></div>
<div class="layout"><aside class="preview"><div class="tabs" id="tabs"></div><div class="phone" id="capture"><div class="nav"><div class="back">‹</div><div class="name"><span id="nameView">강무혁</span> ›</div><div></div></div><div class="messages" id="messages"></div><div class="composer"><div class="plus">＋</div><div class="fake">iMessage</div><div class="send">↑</div></div></div></aside>
<main>
<section class="card"><h2>화면 설정</h2><div class="grid"><div><label>상대 이름</label><input id="name" type="text" value="강무혁"></div><div><label>말풍선 글씨 크기 (10–32px)</label><input id="bsize" type="number" min="10" max="32" value="15"></div><div><label>상대 말풍선 색</label><div class="colors"><input id="lc" type="color" value="#e9e9eb"><span id="lhex"></span></div></div><div><label>내 말풍선 색</label><div class="colors"><input id="rc" type="color" value="#0a84ff"><span id="rhex"></span></div></div></div></section>
<section class="card"><h2>원문 자동 변환</h2><div class="grid"><div><label>별표 밖 대사 화자</label><select id="pside"><option value="left">상대 · 왼쪽</option><option value="right">나 · 오른쪽</option></select></div><div></div><div class="full"><label>원문</label><textarea id="raw" placeholder="왜 전화 안 받았어? *담배를 끄며 미간을 좁힌다.* 어디야."></textarea></div></div><div class="actions"><button class="btn dark" id="parse">자동 분리해서 추가</button></div><div class="help">별표 안은 지문, 별표 밖은 대사로 순서대로 분리되고 별표 자체는 사라져.</div></section>
<section class="card"><h2>대사 직접 추가</h2><div class="grid"><div><label>화자</label><select id="dside"><option value="left">상대 · 왼쪽</option><option value="right">나 · 오른쪽</option></select></div><div></div><div class="full"><label>대사</label><textarea id="dialogue"></textarea></div></div><div class="actions"><button class="btn dark" id="addD">대사 추가</button></div></section>
<section class="card"><h2>지문 직접 추가</h2><div class="tools"><button class="tool" id="bold"><b>B</b></button><button class="tool" id="italic"><i>I</i></button><select id="fs" style="width:auto"><option value="">글씨 크기</option><option>11</option><option>12</option><option>13</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option></select><button class="tool" id="sizeApply">적용</button></div><div id="editor" class="editor" contenteditable="true"></div><div class="hilite"><input id="hc" type="color" value="#fff176"><input id="ho" type="range" min="0" max="100" value="45"><span id="hop">45%</span><button class="btn" id="paint">선택 부분 칠하기</button><button class="btn" id="erase">형광펜 지우기</button></div><div class="actions"><button class="btn dark" id="addN">지문 추가</button></div><div class="help">지문에서 원하는 부분을 드래그한 뒤 굵게·기울임·크기·형광펜을 적용할 수 있어.</div></section>
<section class="card"><h2>페이지 & 내용 관리</h2><div class="actions"><button class="btn blue" id="newPage">페이지 나누기</button><button class="btn red" id="clear">현재 페이지 비우기</button></div><div class="help">페이지 나누기를 누르면 새 iMessage 화면이 생겨. PAGE 버튼으로 이동할 수 있어.</div><div class="list" id="list"></div></section>
</main></div></div>
<script>
const $=s=>document.querySelector(s),root=document.documentElement,S={p:0,pages:[[]]};const pg=()=>S.pages[S.p];
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clean(h){let t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,style,iframe,object').forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(a.name!=='style')e.removeAttribute(a.name);else{let ok=[];for(let p of e.style)if(['font-weight','font-style','font-size','background-color'].includes(p))ok.push(p+':'+e.style.getPropertyValue(p));ok.length?e.setAttribute('style',ok.join(';')):e.removeAttribute('style')}}));return t.innerHTML}
function txt(h){let d=document.createElement('div');d.innerHTML=h;return d.textContent||''}
function render(){let tabs=$('#tabs');tabs.innerHTML='';S.pages.forEach((x,i)=>{let b=document.createElement('button');b.className='tab'+(i===S.p?' on':'');b.textContent='PAGE '+(i+1);b.onclick=()=>{S.p=i;render()};tabs.append(b)});let m=$('#messages');m.innerHTML='';pg().forEach(x=>{if(x.type==='d'){let r=document.createElement('div');r.className='row '+x.side;let b=document.createElement('div');b.className='bubble';b.textContent=x.text;r.append(b);m.append(r)}else{let n=document.createElement('div');n.className='nar';n.innerHTML=clean(x.html);m.append(n)}});let l=$('#list');l.innerHTML='';pg().forEach((x,i)=>{let e=document.createElement('div');e.className='item';let a=document.createElement('div');a.className='badge';a.textContent=x.type==='n'?'지문':x.side==='left'?'상대':'나';let s=document.createElement('div');s.className='snip';s.textContent=x.type==='n'?txt(x.html):x.text;let c=document.createElement('div');['↑','↓','삭제'].forEach((q,j)=>{let b=document.createElement('button');b.className='mini';b.textContent=q;b.onclick=()=>{if(j===0&&i>0){[pg()[i-1],pg()[i]]=[pg()[i],pg()[i-1]]}else if(j===1&&i<pg().length-1){[pg()[i+1],pg()[i]]=[pg()[i],pg()[i+1]]}else if(j===2)pg().splice(i,1);render()};c.append(b)});e.append(a,s,c);l.append(e)})}
function settings(){let z=Math.max(10,Math.min(32,+$('#bsize').value||15));root.style.setProperty('--bs',z+'px');root.style.setProperty('--left',$('#lc').value);root.style.setProperty('--right',$('#rc').value);$('#nameView').textContent=$('#name').value.trim()||'상대';$('#lhex').textContent=$('#lc').value.toUpperCase();$('#rhex').textContent=$('#rc').value.toUpperCase()}
['name','bsize','lc','rc'].forEach(id=>$('#'+id).oninput=settings);
$('#parse').onclick=()=>{let raw=$('#raw').value;if(!raw.trim())return,0;let side=$('#pside').value,re=/\*([\s\S]*?)\*/g,last=0,m;while((m=re.exec(raw))){let d=raw.slice(last,m.index).trim();if(d)pg().push({type:'d',side,text:d});let n=m[1].trim();if(n)pg().push({type:'n',html:esc(n).replace(/\n/g,'<br>')});last=re.lastIndex}let d=raw.slice(last).trim();if(d)pg().push({type:'d',side,text:d});$('#raw').value='';render()};
$('#addD').onclick=()=>{let t=$('#dialogue').value.trim();if(t){pg().push({type:'d',side:$('#dside').value,text:t});$('#dialogue').value='';render()}};
let R=null,E=$('#editor');function saveSel(){let s=getSelection();if(s.rangeCount&&E.contains(s.anchorNode))R=s.getRangeAt(0).cloneRange()}E.onmouseup=saveSel;E.onkeyup=saveSel;
function wrap(st){if(!R)return;let s=getSelection();s.removeAllRanges();s.addRange(R);if(s.isCollapsed)return;let r=s.getRangeAt(0),sp=document.createElement('span');Object.assign(sp.style,st);try{r.surroundContents(sp)}catch{let f=r.extractContents();sp.append(f);r.insertNode(sp)}s.removeAllRanges();R=null;E.focus()}
['bold','italic','sizeApply','paint','erase'].forEach(id=>$('#'+id).onmousedown=e=>e.preventDefault());
$('#bold').onclick=()=>wrap({fontWeight:'700'});$('#italic').onclick=()=>wrap({fontStyle:'italic'});$('#sizeApply').onclick=()=>{if($('#fs').value)wrap({fontSize:$('#fs').value+'px'})};$('#ho').oninput=()=>$('#hop').textContent=$('#ho').value+'%';
$('#paint').onclick=()=>{let h=$('#hc').value,o=+$('#ho').value/100,r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);wrap({backgroundColor:`rgba(${r},${g},${b},${o})`})};$('#erase').onclick=()=>wrap({backgroundColor:'transparent'});
$('#addN').onclick=()=>{let h=clean(E.innerHTML);if(txt(h).trim()){pg().push({type:'n',html:h});E.innerHTML='';render()}};
$('#newPage').onclick=()=>{S.pages.splice(S.p+1,0,[]);S.p++;render()};$('#clear').onclick=()=>{S.pages[S.p]=[];render()};$('#reset').onclick=()=>{if(confirm('모든 내용을 초기화할까?')){S.pages=[[]];S.p=0;render()}};
async function shot(name){let mod=await import('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/+esm'),u=await mod.toPng($('#capture'),{pixelRatio:3,backgroundColor:'#fff'}),a=document.createElement('a');a.href=u;a.download=name;a.click()}
$('#png').onclick=async()=>{try{await shot(`message-page-${S.p+1}.png`)}catch{alert('PNG 저장에 실패했어.')}};$('#pngAll').onclick=async()=>{let o=S.p;try{for(let i=0;i<S.pages.length;i++){S.p=i;render();await new Promise(r=>setTimeout(r,100));await shot(`message-page-${i+1}.png`);await new Promise(r=>setTimeout(r,250))}}catch{alert('브라우저에서 여러 다운로드 허용을 확인해 줘.')}S.p=o;render()};
settings();render();
</script></body></html>
